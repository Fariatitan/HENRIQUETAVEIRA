*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-font-smoothing:antialiased}
body{background:var(--bg);color:var(--fg);font-family:'Jost',ui-sans-serif,system-ui,sans-serif;font-weight:300;font-size:17px;line-height:1.6}
::selection{background:#0D0D0D;color:#fff}
a{color:inherit;text-decoration:none}
button{font:inherit;background:none;border:none;color:inherit}
img{display:block}
:focus-visible{outline:2px solid #0D0D0D;outline-offset:4px}
.label{font-size:11px;letter-spacing:.4em;text-transform:uppercase;font-weight:500}
.muted{color:var(--muted)}
.block{display:block}
.container{padding-left:24px;padding-right:24px}
@media(min-width:768px){.container{padding-left:40px;padding-right:40px}}

/* Header */
.site-header{position:fixed;top:0;left:0;right:0;z-index:50;mix-blend-mode:difference}
.site-header .bar{display:flex;justify-content:space-between;align-items:center;padding:22px 24px}
@media(min-width:768px){.site-header .bar{padding:24px 40px}}
.site-header a,.site-header button{color:#fff;letter-spacing:.3em;font-size:11px;text-transform:uppercase;font-weight:500}
.site-header .brand{font-size:12px}

/* Cursor */
.cursor{position:fixed;top:0;left:0;z-index:9999;pointer-events:none;transform:translate(-100px,-100px);display:none}
@media(pointer:fine){.cursor{display:block}body,a,button,input,textarea,select,label{cursor:none}}
.cursor-dot{width:20px;height:20px;border:1px solid var(--fg);border-radius:50%;transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;opacity:.45;transition:width .35s cubic-bezier(.7,0,.3,1),height .35s cubic-bezier(.7,0,.3,1),opacity .35s,background .35s}
.cursor.hovering .cursor-dot{width:92px;height:92px;opacity:1;background:rgba(255,255,255,.1);backdrop-filter:blur(2px)}
#cursorLabel{font-size:9px;letter-spacing:.3em;text-transform:uppercase;font-weight:500}

/* Reveal */
.reveal{opacity:0;transform:translateY(40px);transition:opacity .8s cubic-bezier(.7,0,.3,1),transform .8s cubic-bezier(.7,0,.3,1)}
.reveal.revealed{opacity:1;transform:none}

/* Hero */
.hero{position:relative;height:100svh;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
.hero-bg{position:absolute;inset:0;will-change:transform}
.hero-bg img{width:100%;height:100%;object-fit:cover}
.hero-bg::after{content:'';position:absolute;inset:0;background:rgba(255,255,255,.25)}
.hero-content{position:relative;z-index:2;padding:0 24px 56px}
@media(min-width:768px){.hero-content{padding:0 40px 80px}}
.hero-content h1{font-weight:200;font-size:16vw;line-height:.82;letter-spacing:.04em;margin-top:16px}
@media(min-width:768px){.hero-content h1{font-size:15vw}}
.hero-scroll{position:absolute;bottom:32px;left:50%;transform:translateX(-50%);z-index:2;display:flex;flex-direction:column;align-items:center;gap:8px;color:rgba(13,13,13,.5)}
.hero-scroll .line{width:1px;height:40px;background:rgba(13,13,13,.4);animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:translateY(0)}50%{transform:translateY(8px)}}

/* Manifesto / Banner */
.manifesto{padding:112px 24px}
@media(min-width:768px){.manifesto{padding:192px 40px}}
.manifesto-inner{max-width:960px}
.manifesto p{margin-top:32px;font-weight:300;font-size:30px;line-height:1.2;letter-spacing:.01em}
@media(min-width:768px){.manifesto p{font-size:48px}}
.banner{width:100%;height:55vh;overflow:hidden}
@media(min-width:768px){.banner{height:80vh}}
.banner img{width:100%;height:100%;object-fit:cover}

/* Grid */
.section-grid{padding:96px 0}
@media(min-width:768px){.section-grid{padding:128px 0}}
.grid-wrap{display:grid;grid-template-columns:repeat(12,1fr);column-gap:40px}
.filter-aside{display:none}
@media(min-width:768px){.filter-aside{display:block;grid-column:span 2;position:sticky;top:112px;align-self:start}}
.filter-list{display:flex;flex-direction:column;gap:12px;list-style:none}
.filter-item{display:flex;gap:12px;align-items:baseline;color:var(--muted);transition:color .2s;text-align:left}
.filter-item.active,.filter-item:hover{color:var(--fg)}
.filter-num{font-size:11px;letter-spacing:.4em;text-transform:uppercase;opacity:.6;font-weight:500}
.filter-label{font-size:13px;letter-spacing:.18em;text-transform:uppercase}
.filter-count{font-size:11px;letter-spacing:.4em;opacity:.4;margin-left:4px;font-weight:500}
.grid-main{grid-column:1/-1}
@media(min-width:768px){.grid-main{grid-column:span 10}}
.pillbar{position:sticky;top:60px;z-index:30;display:flex;gap:8px;overflow-x:auto;padding:12px 24px;background:rgba(255,255,255,.7);backdrop-filter:blur(12px);border-bottom:1px solid var(--hairline);margin:0 -24px 40px}
@media(min-width:768px){.pillbar{display:none}}
.pill{white-space:nowrap;padding:8px 16px;border:1px solid rgba(13,13,13,.15);border-radius:999px;font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}
.pill.active{background:var(--fg);color:#fff;border-color:var(--fg)}
.grid-head{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1px solid var(--hairline);padding-bottom:24px;margin-bottom:64px}
.grid-head h2{font-weight:300;font-size:36px;letter-spacing:.1em;text-transform:uppercase}
@media(min-width:768px){.grid-head h2{font-size:56px}}
.works-grid{display:grid;grid-template-columns:1fr;row-gap:64px;column-gap:40px}
@media(min-width:768px){.works-grid{grid-template-columns:repeat(12,1fr);row-gap:96px}}
.work-card{display:block}
@media(min-width:768px){.work-card.small{grid-column:span 5;margin-top:96px}.work-card.large{grid-column:span 7}}
.card-img{overflow:hidden;background:var(--ghost)}
.card-img.ratio-43{aspect-ratio:4/3}
.card-img.ratio-45{aspect-ratio:4/5}
.card-img img{width:100%;height:100%;object-fit:cover;transition:transform 1.2s cubic-bezier(.7,0,.3,1)}
.work-card:hover .card-img img{transform:scale(1.03)}
.card-meta{display:flex;justify-content:space-between;margin-top:16px}
.card-title{margin-top:8px;font-weight:300;font-size:20px;letter-spacing:.15em;text-transform:uppercase}
@media(min-width:768px){.card-title{font-size:24px}}
.empty{padding:80px 0;text-align:center;color:var(--muted)}

/* Detalhe da obra */
.page{padding-top:112px;padding-bottom:128px}
.back{color:var(--muted);transition:color .2s}
.back:hover{color:var(--fg)}
.detail-kicker{margin-top:48px;color:var(--muted)}
.detail-title{margin-top:16px;font-weight:200;font-size:11vw;line-height:.9;letter-spacing:.04em;text-transform:uppercase}
@media(min-width:768px){.detail-title{font-size:6.5vw}}
.detail-actions{margin-top:40px;display:flex;flex-wrap:wrap;gap:16px}
.btn{display:inline-block;padding:12px 24px;border:1px solid var(--fg);font-size:11px;letter-spacing:.25em;text-transform:uppercase;transition:background .25s,color .25s,border-color .25s}
.btn:hover{background:var(--fg);color:#fff}
.btn.ghost-btn{border-color:rgba(13,13,13,.2)}
.btn.ghost-btn:hover{background:none;color:var(--fg);border-color:var(--fg)}
.gallery{margin-top:80px;display:flex;flex-direction:column;gap:24px}
@media(min-width:768px){.gallery{gap:48px}}
.gallery-item{display:block;width:100%}
.gframe{overflow:hidden;background:var(--ghost)}
.gframe.wide{aspect-ratio:16/9}
.gframe.tall{aspect-ratio:4/5;max-width:720px;margin:0 auto}
.gframe img{width:100%;height:100%;object-fit:cover;transition:transform 1.2s cubic-bezier(.7,0,.3,1)}
.gallery-item:hover .gframe img{transform:scale(1.02)}

/* Gaveta técnica */
.drawer-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:90;opacity:0;pointer-events:none;transition:opacity .4s}
.drawer-backdrop.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:100%;background:#fff;z-index:91;padding:40px 24px;overflow-y:auto;transform:translateX(100%);transition:transform .5s cubic-bezier(.7,0,.3,1)}

.drawer.open{transform:translateX(0)}
.drawer-close{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.3em;text-transform:uppercase;margin-left:auto}
.drawer .d-title{margin-top:40px;font-weight:300;font-size:28px;letter-spacing:.1em;text-transform:uppercase}
.drawer dl{margin-top:48px;display:flex;flex-direction:column;gap:32px}
.drawer dt{font-size:11px;letter-spacing:.4em;text-transform:uppercase;font-weight:500;color:var(--muted)}
.drawer dd{margin-top:8px;font-size:18px;font-weight:300}
.drawer dd.concept{font-size:16px;color:var(--muted);line-height:1.7}

/* Lightbox */
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:100;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .35s}
.lightbox.open{opacity:1;pointer-events:auto}
.lightbox img{max-height:88vh;max-width:90vw;object-fit:contain}
.lb-close{position:absolute;top:24px;right:24px;color:#fff;font-size:11px;letter-spacing:.3em;text-transform:uppercase}
.lb-prev,.lb-next{position:absolute;top:50%;transform:translateY(-50%);color:rgba(255,255,255,.8);padding:8px;font-size:28px;line-height:1}
.lb-prev{left:16px}.lb-next{right:16px}
.lb-count{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.6);font-size:11px;letter-spacing:.4em;text-transform:uppercase;font-weight:500}

/* Contato */
.contact{position:fixed;inset:0;background:#fff;z-index:100;display:flex;flex-direction:column;opacity:0;pointer-events:none;transition:opacity .4s}

@media(min-width:768px){.contact h2{font-size:7vw}}

.contact-channels{margin-top:56px;display:grid;gap:40px;border-top:1px solid var(--hairline);padding-top:40px}
@media(min-width:768px){.contact-channels{grid-template-columns:1fr 1fr}}
.contact-channels a p{margin-top:8px;font-size:26px;font-weight:300;transition:opacity .25s}
@media(min-width:768px){.contact-channels a p{font-size:30px}}
.contact-channels a:hover p{opacity:.6}

.about-grid{display:grid;grid-template-columns:1fr;gap:48px}
@media(min-width:768px){.about-grid{grid-template-columns:5fr 7fr;column-gap:40px}}
.about-sticky{position:static}
@media(min-width:768px){.about-sticky{position:sticky;top:112px}}
.portrait{aspect-ratio:4/5;overflow:hidden;background:var(--ghost)}

.site-footer{border-top:1px solid var(--hairline);padding:64px 24px;display:flex;flex-direction:column;gap:32px}

.footer-links a{transition:color .2s}
.footer-links a:hover{color:var(--fg)}
</style>

  {

    concept: 'Vitrina que veste o espaço. Peças de alfaiataria dispostas como esculturas operárias em conversa direta com a arquitetura que as abriga.',
    gridSize: 'large',
    images: ['https://media.base44.com/images/public/6aac78af54f81a5cc0f14ece/4bda98c53_generated_76358a3e.jpg', 'https://media.base44.com/images/public/6aac78af54f81a5cc0f14ece/92a72808a_generated_18f140ea.jpg']
  },
  {
    slug: 'serie-corpo-vol-ii', title: 'SÉRIE CORPO — VOL. II', category: 'pintura',
    categoryLabel: 'Pintura & Série Corpo', year: '2024',
    materials: 'Linho, tinta acrílica, grafite',
    concept: 'Continuação da série. O impasto engrossa; o corpo se abstrai em matéria e traço, perdendo contorno e ganhando peso.',
    gridSize: 'small',
    images: ['https://media.base44.com/images/public/6aac78af54f81a5cc0f14ece/be72e0dbe_generated_f5a24456.jpg', 'https://media.base44.com/images/public/6aac78af54f81a5cc0f14ece/97d8f5265_generated_79fec2d2.jpg']
  },
  {
    slug: 'estrutura-fluidez', title: 'ESTRUTURA / FLUIDEZ', category: 'moda',
    categoryLabel: 'Moda & Alfaiataria', year: '2023',
    materials: 'Lã estruturada, seda fluida',
    concept: 'Diálogo entre o que sustenta e o que cai. A alfaiataria rígida encontra a seda que escapa — duas gramáticas do corpo no mesmo olhar.',
    gridSize: 'small',
    images: ['https://media.base44.com/images/public/6aac78af54f81a5cc0f14ece/bc04b3c86_generated_d64924fa.jpg', 'https://media.base44.com/images/public/6aac78af54f81a5cc0f14ece/be947933e_generated_f97af9c4.jpg']
  }
];

var FACTS = [
  { num: '01', label: 'IED', text: 'Design de Moda no Istituto Europeo di Design — formação em alfaiataria, modelagem e direção de moda.' },
  { num: '02', label: 'PUC', text: 'Arquitetura & Urbanismo na PUC — leitura estrutural do espaço, do corpo e da silhueta como construção.' },
  { num: '03', label: 'ANIMALE & Cases', text: 'Mais de seis anos liderando a alfaiataria da ANIMALE, além de direção criativa e projetos especiais.' }
];

/* ============ ESTADO ============ */
var app = document.getElementById('app');
var activeCategory = 'panorama';
var currentWork = null;
var interest = 'Aquisição';
var homeScrollHandler = null;
var io = null;

/* ============ HELPERS ============ */
function pad(n) { return String(n).padStart(2, '0'); }
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

function setupReveal() {
  if (io) io.disconnect();
  io = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      if (e.isIntersecting) { e.target.classList.add('revealed'); io.unobserve(e.target); }
    });
  }, { rootMargin: '-10%' });
  document.querySelectorAll('.reveal:not(.revealed)').forEach(function (el) { io.observe(el); });
}

/* ============ VIEW: HOME ============ */
function renderHome() {
  var counts = { panorama: WORKS.length };
  CATEGORIES.forEach(function (c) {
    if (c.id !== 'panorama') counts[c.id] = WORKS.filter(function (w) { return w.category === c.id; }).length;
  });
  var filtered = activeCategory === 'panorama' ? WORKS : WORKS.filter(function (w) { return w.category === activeCategory; });

  var filterItems = CATEGORIES.map(function (c) {
    return '<li><button class="filter-item ' + (activeCategory === c.id ? 'active' : '') + '" data-action="set-filter" data-cat="' + c.id + '" data-cursor="">' +
      '<span class="filter-num">' + c.num + '</span>' +
      '<span class="filter-label">' + esc(c.label) + '</span>' +
      '<span class="filter-count">' + pad(counts[c.id] || 0) + '</span>' +
      '</button></li>';
  }).join('');

  var pills = CATEGORIES.map(function (c) {
    return '<button class="pill ' + (activeCategory === c.id ? 'active' : '') + '" data-action="set-filter" data-cat="' + c.id + '">' + esc(c.label) + '</button>';
  }).join('');

  var cards = filtered.map(function (w) {
    var large = w.gridSize === 'large';
    return '<a class="work-card reveal ' + (large ? 'large' : 'small') + '" href="#/trabalho/' + w.slug + '" data-cursor="VER">' +
      '<div class="card-img ' + (large ? 'ratio-43' : 'ratio-45') + '"><img src="' + w.images[0] + '" alt="' + esc(w.title) + '" loading="lazy"></div>' +
      '<div class="card-meta"><span class="label muted">' + esc(w.categoryLabel) + '</span><span class="label muted">' + esc(w.year) + '</span></div>' +
      '<h3 class="card-title">' + esc(w.title) + '</h3>' +
      '</a>';
  }).join('');

  app.innerHTML =
    '<section class="hero">' +
      '<div class="hero-bg" id="heroBg"><img src="' + HERO_IMG + '" alt="Abertura editorial do ateliê de Henrique Taveira"></div>' +
      '<div class="hero-content" id="heroContent">' +
        '<span class="label" style="color:rgba(13,13,13,.7)">Estilista · Artista Visual · Diretor Criativo</span>' +
        '<h1>HENRIQUE<br>TAVEIRA</h1>' +
      '</div>' +
      '<div class="hero-scroll" id="heroScroll"><span class="label">Role para entrar</span><span class="line"></span></div>' +
    '</section>' +

    '<section class="manifesto"><div class="manifesto-inner reveal">' +
      '<span class="label muted">Manifesto</span>' +
      '<p>A alfaiataria é arquitetura do corpo. A pintura é o corpo vendo o corpo. Este ateliê existe no intervalo entre o fio e o traço — onde a silhueta se faz matéria e a matéria se faz narrativa.</p>' +
    '</div></section>' +

    '<section class="banner"><img src="' + BANNER_IMG + '" alt="Interior do ateliê de Henrique Taveira"></section>' +

    '<section class="section-grid container">' +
      '<div class="grid-wrap">' +
        '<aside class="filter-aside"><ul class="filter-list">' + filterItems + '</ul></aside>' +
        '<div class="grid-main">' +
          '<div class="pillbar">' + pills + '</div>' +
          '<div class="grid-head"><h2>Panorama</h2><span class="label muted">' + pad(filtered.length) + ' obras</span></div>' +
          '<div class="works-grid">' + (cards || '<p class="empty label">Nenhuma obra nesta categoria</p>') + '</div>' +
        '</div>' +
      '</div>' +
    '</section>' +

    '<footer class="site-footer">' +
      '<div><p class="name">Henrique Taveira</p><p class="label muted" style="margin-top:12px">Ateliê · Rio de Janeiro / São Paulo</p></div>' +
      '<div class="footer-links">' +
        '<a href="https://wa.me/' + WHATSAPP + '" target="_blank" rel="noreferrer" data-cursor="">+55 11 95070-4952</a>' +
        '<a href="mailto:' + EMAIL + '" data-cursor="">' + EMAIL + '</a>' +
        '<a href="#/sobre" data-cursor="">Sobre o ateliê</a>' +
      '</div>' +
    '</footer>';

  setupHomeScroll();
  setupReveal();
}

function setupHomeScroll() {
  var bg = document.getElementById('heroBg');
  var content = document.getElementById('heroContent');
  var hint = document.getElementById('heroScroll');
  if (!bg) return;
  homeScrollHandler = function () {
    var y = window.scrollY;
    if (y > window.innerHeight * 1.2) return;
    bg.style.transform = 'translateY(' + (y * 0.2) + 'px) scale(' + (1 + (y / 700) * 0.08) + ')';
    var op = Math.max(0, 1 - y / 500);
    content.style.opacity = op;
    hint.style.opacity = op;
  };
  window.addEventListener('scroll', homeScrollHandler, { passive: true });
  homeScrollHandler();
}

/* ============ VIEW: OBRA ============ */
function renderWork(slug) {
  var w = WORKS.find(function (x) { return x.slug === slug; });
  if (!w) {
    app.innerHTML = '<div class="page container"><a class="back label" href="#/" data-cursor="">← Panorama</a><p style="margin-top:40px;font-size:24px;font-weight:300">Obra não encontrada.</p></div>';
    return;
  }
  currentWork = w;

  var gallery = w.images.map(function (img, i) {
    return '<button class="gallery-item reveal" data-action="open-lightbox" data-index="' + i + '" data-cursor="VER" aria-label="Ampliar imagem ' + (i + 1) + '">' +
      '<div class="gframe ' + (i % 2 === 0 ? 'wide' : 'tall') + '"><img src="' + img + '" alt="' + esc(w.title) + ' — imagem ' + (i + 1) + '" loading="lazy"></div>' +
      '</button>';
  }).join('');

  app.innerHTML =
    '<div class="page container">' +
      '<a class="back label" href="#/" data-cursor="">← Panorama</a>' +
      '<span class="detail-kicker label muted block">' + esc(w.categoryLabel) + ' · ' + esc(w.year) + '</span>' +
      '<h1 class="detail-title">' + esc(w.title) + '</h1>' +
      '<div class="detail-actions">' +
        '<button class="btn" data-action="open-drawer" data-cursor="ABRIR">Ficha Técnica</button>' +
        '<a class="btn ghost-btn" href="https://wa.me/' + WHATSAPP + '?text=' + encodeURIComponent('Olá Henrique, tenho interesse na obra "' + w.title + '".') + '" target="_blank" rel="noreferrer" data-cursor="">Atendimento · WhatsApp</a>' +
      '</div>' +
      '<div class="gallery">' + gallery + '</div>' +
    '</div>';

  setupReveal();
}

/* ============ VIEW: SOBRE ============ */
function renderAbout() {
  var facts = FACTS.map(function (f) {
    return '<div class="reveal"><span class="label muted">' + f.num + '</span><h3>' + esc(f.label) + '</h3><p>' + esc(f.text) + '</p></div>';
  }).join('');

  app.innerHTML =
    '<div class="about container">' +
      '<div class="about-grid">' +
        '<div><div class="about-sticky">' +
          '<div class="portrait"><img src="' + PORTRAIT_IMG + '" alt="Retrato de Henrique Taveira em seu ateliê"></div>' +
          '<span class="label muted block" style="margin-top:16px">Henrique Taveira · Ateliê</span>' +
        '</div></div>' +
        '<div>' +
          '<div class="reveal"><span class="label muted">Perfil & Trajetória</span><h1>Sobre</h1></div>' +
          '<div class="about-bio reveal">' +
            '<p>Henrique Taveira é estilista, artista visual e diretor criativo. Sua prática transita entre a alfaiataria de autor, a pesquisa têxtil e as artes plásticas.</p>' +
            '<p>Dupla formação — Design de Moda (IED) e Arquitetura & Urbanismo (PUC) — sustenta um olhar que lê o corpo como estrutura e o tecido como desenho.</p>' +
            '<p>Liderou por mais de seis anos a alfaiataria da ANIMALE, construindo silhuetas que cruzam rigidez construída e fluidez escultural. Em paralelo, desenvolve séries pictóricas e projetos especiais que expandem a moda para o campo da arte.</p>' +
            '<p>O ateliê, com base entre Rio de Janeiro e São Paulo, opera como concierge: aquisições, alfaiataria sob medida e direção criativa.</p>' +
          '</div>' +
          '<div class="facts">' + facts + '</div>' +
        '</div>' +
      '</div>' +
    '</div>';

  setupReveal();
}

/* ============ GAVETA TÉCNICA ============ */
var drawer = document.getElementById('drawer');
var drawerBd = document.getElementById('drawerBd');

function openDrawer(w) {
  document.getElementById('dTitle').textContent = w.title;
  document.getElementById('dYear').textContent = w.year;
  document.getElementById('dCat').textContent = w.categoryLabel;
  document.getElementById('dMat').textContent = w.materials;
  document.getElementById('dConcept').textContent = w.concept;
  drawer.classList.add('open');
  drawerBd.classList.add('open');
}
function closeDrawer() {
  drawer.classList.remove('open');
  drawerBd.classList.remove('open');
}
drawerBd.addEventListener('click', closeDrawer);

/* ============ LIGHTBOX ============ */
var lightbox = document.getElementById('lightbox');
var lbImg = document.getElementById('lbImg');
var lbCount = document.getElementById('lbCount');
var lbImages = [], lbIndex = 0;

function openLightbox(images, i) {
  lbImages = images; lbIndex = i;
  updateLightbox();
  lightbox.classList.add('open');
  document.body.style.overflow = 'hidden';
}
function updateLightbox() {
  lbImg.src = lbImages[lbIndex];
  lbCount.textContent = pad(lbIndex + 1) + ' / ' + pad(lbImages.length);
}
function closeLightbox() {
  lightbox.classList.remove('open');
  document.body.style.overflow = '';
}
function lbPrev() { lbIndex = (lbIndex - 1 + lbImages.length) % lbImages.length; updateLightbox(); }
function lbNext() { lbIndex = (lbIndex + 1) % lbImages.length; updateLightbox(); }
lightbox.addEventListener('click', function (e) { if (e.target === lightbox) closeLightbox(); });

/* ============ CONTATO ============ */
var contact = document.getElementById('contact');
var interestsWrap = document.getElementById('interests');
var INTEREST_OPTIONS = ['Aquisição', 'Alfaiataria', 'Direção Criativa'];

function renderInterests() {
  interestsWrap.innerHTML = INTEREST_OPTIONS.map(function (i) {
    return '<button class="interest ' + (interest === i ? 'active' : '') + '" data-action="set-interest" data-val="' + esc(i) + '" data-cursor="">' + esc(i) + '</button>';
  }).join('');
  document.getElementById('waLink').href = 'https://wa.me/' + WHATSAPP + '?text=' + encodeURIComponent('Olá Henrique, tenho interesse em ' + interest + '.');
  document.getElementById('mailLink').href = 'mailto:' + EMAIL + '?subject=' + encodeURIComponent(interest);
}
function openContact() { contact.classList.add('open'); document.body.style.overflow = 'hidden'; }
function closeContact() { contact.classList.remove('open'); document.body.style.overflow = ''; }
renderInterests();

/* ============ ROUTER ============ */
function route() {
  var h = (location.hash || '#/').replace(/^#/, '');
  if (homeScrollHandler) { window.removeEventListener('scroll', homeScrollHandler); homeScrollHandler = null; }
  closeDrawer();
  closeLightbox();
  closeContact();

  var m = h.match(/^\/trabalho\/(.+)$/);
  if (m) renderWork(decodeURIComponent(m[1]));
  else if (h === '/sobre') renderAbout();
  else renderHome();

  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);

/* ============ AÇÕES GLOBAIS ============ */
document.addEventListener('click', function (e) {
  var t = e.target.closest('[data-action]');
  if (!t) return;
  var a = t.getAttribute('data-action');
  if (a === 'open-contact') openContact();
  else if (a === 'close-contact') closeContact();
  else if (a === 'set-interest') { interest = t.getAttribute('data-val'); renderInterests(); }
  else if (a === 'set-filter') { activeCategory = t.getAttribute('data-cat'); renderHome(); }
  else if (a === 'open-drawer' && currentWork) openDrawer(currentWork);
  else if (a === 'close-drawer') closeDrawer();
  else if (a === 'open-lightbox' && currentWork) openLightbox(currentWork.images, parseInt(t.getAttribute('data-index'), 10));
  else if (a === 'close-lightbox') closeLightbox();
  else if (a === 'lb-prev') lbPrev();
  else if (a === 'lb-next') lbNext();
});

document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') {
    if (lightbox.classList.contains('open')) closeLightbox();
    else if (contact.classList.contains('open')) closeContact();
    else if (drawer.classList.contains('open')) closeDrawer();
  }
  if (lightbox.classList.contains('open')) {
    if (e.key === 'ArrowLeft') lbPrev();
    if (e.key === 'ArrowRight') lbNext();
  }
});

/* ============ CURSOR MAGNÉTICO ============ */
(function () {
  if (!window.matchMedia('(pointer:fine)').matches) return;
  var cursor = document.getElementById('cursor');
  var label = document.getElementById('cursorLabel');
  window.addEventListener('mousemove', function (e) {
    cursor.style.transform = 'translate(' + e.clientX + 'px,' + e.clientY + 'px)';
  });
  document.addEventListener('mouseover', function (e) {
    var t = e.target.closest('[data-cursor]');
    if (t) { cursor.classList.add('hovering'); label.textContent = t.getAttribute('data-cursor') || ''; }
  });
  document.addEventListener('mouseout', function (e) {
    var t = e.target.closest('[data-cursor]');
    if (t) cursor.classList.remove('hovering');
  });
})();

/* ============ INICIALIZAÇÃO ============ */
route();
</script>

</html>
