/* ============ CORE APP ============ */
var app = document.getElementById('app');
var activeCategory = 'panorama';
var interest = 'Aquisição';
var currentWork = null;
var homeScrollHandler = null;

function esc(s) {
  return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function pad(n) { return (n < 10 ? '0' : '') + n; }

function setupReveal() {
  if (!('IntersectionObserver' in window)) {
    document.querySelectorAll('.reveal').forEach(function (el) { el.classList.add('revealed'); });
    return;
  }
  var obs = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      if (e.isIntersecting) {
        e.target.classList.add('revealed');
        obs.unobserve(e.target);
      }
    });
  }, { threshold: 0.08 });
  document.querySelectorAll('.reveal:not(.revealed)').forEach(function (el) { obs.observe(el); });
}

function renderHome() {
  var filtered = activeCategory === 'panorama'
    ? WORKS
    : WORKS.filter(function (w) { return w.category === activeCategory; });

  var filterItems = CATEGORIES.map(function (c) {
    var count = c.id === 'panorama' ? WORKS.length : WORKS.filter(function (w) { return w.category === c.id; }).length;
    var active = c.id === activeCategory ? 'active' : '';
    return '<li class="filter-item ' + active + '" data-action="set-filter" data-cat="' + c.id + '" data-cursor="">' +
      '<span class="filter-num">' + c.num + '</span>' +
      '<span class="filter-label">' + esc(c.label) + '</span>' +
      '<span class="filter-count">' + count + '</span>' +
    '</li>';
  }).join('');

  var pills = CATEGORIES.map(function (c) {
    var active = c.id === activeCategory ? 'active' : '';
    return '<button class="pill ' + active + '" data-action="set-filter" data-cat="' + c.id + '">' + esc(c.label) + '</button>';
  }).join('');

  var worksHtml = filtered.length === 0
    ? '<p class="empty label">Nenhuma obra nesta categoria.</p>'
    : filtered.map(function (w) {
        var spanClass = w.gridSpan || (w.gridSize === 'small' ? 'col-5' : 'col-7');
        var ratioClass = w.gridRatio || (w.gridSize === 'small' ? 'ratio-45' : 'ratio-43');
        var img0 = (w.images && w.images[0]) || '';
        var posStyle = w.imgPos ? 'object-position:' + w.imgPos + ';' : '';
        var zoomStyle = (w.imgZoom && w.imgZoom !== '100%') ? 'transform:scale(' + (parseFloat(w.imgZoom)/100) + ');' : '';
        var fitStyle = w.imgFit ? 'object-fit:' + w.imgFit + ';' : '';
        var styleAttr = (posStyle || zoomStyle || fitStyle) ? ' style="' + posStyle + zoomStyle + fitStyle + '"' : '';
        return '<a class="work-card ' + spanClass + ' reveal" href="#/trabalho/' + encodeURIComponent(w.slug) + '" data-cursor="VER">' +
          '<div class="card-img ' + ratioClass + '"><img src="' + img0 + '" alt="' + esc(w.title) + '" loading="lazy"' + styleAttr + '></div>' +
          '<div class="card-meta">' +
            '<span class="label muted">' + esc(w.categoryLabel || w.category) + '</span>' +
            '<span class="label muted">' + esc(w.year) + '</span>' +
          '</div>' +
          '<h3 class="card-title">' + esc(w.title) + '</h3>' +
        '</a>';
      }).join('');

  app.innerHTML =
    '<section class="hero">' +
      '<div class="hero-bg" id="heroBg"><img src="' + HERO_IMG + '" alt="Ateliê Henrique Taveira"></div>' +
      '<div class="hero-content container reveal">' +
        '<span class="label muted block">Estilista · Artista Visual · Diretor Criativo</span>' +
        '<h1>HENRIQUE<br>TAVEIRA</h1>' +
      '</div>' +
      '<div class="hero-scroll" id="heroScroll"><span class="label">Rolar</span><div class="line"></div></div>' +
    '</section>' +
    '<section class="manifesto container reveal">' +
      '<div class="manifesto-inner">' +
        '<span class="label muted">Manifesto do Ateliê</span>' +
        '<p>A alfaiataria é arquitetura do corpo. A pintura é o corpo vendo o corpo. Este ateliê existe no intervalo entre o fio e o traço — onde a silhueta se faz matéria e a matéria se faz narrativa.</p>' +
      '</div>' +
    '</section>' +
    '<section class="banner reveal"><img src="' + BANNER_IMG + '" alt="Ateliê Henrique Taveira" loading="lazy"></section>' +
    '<section class="section-grid container">' +
      '<div class="pillbar">' + pills + '</div>' +
      '<div class="grid-wrap">' +
        '<aside class="filter-aside"><ul class="filter-list">' + filterItems + '</ul></aside>' +
        '<div class="grid-main">' +
          '<div class="grid-head reveal"><h2>Acervo</h2><span class="label muted">' + filtered.length + ' Peças</span></div>' +
          '<div class="works-grid">' + worksHtml + '</div>' +
        '</div>' +
      '</div>' +
    '</section>' +
    '<footer class="container reveal">' +
      '<div><p class="name">Henrique Taveira</p><p class="label muted" style="margin-top:12px">Ateliê · Rio de Janeiro / São Paulo</p></div>' +
      '<div class="footer-links">' +
        '<a href="https://wa.me/' + WHATSAPP + '" target="_blank" rel="noreferrer" data-cursor="">+' + WHATSAPP + '</a>' +
        '<a href="mailto:' + EMAIL + '" data-cursor="">' + EMAIL + '</a>' +
        '<a href="#/sobre" data-cursor="">Sobre o ateliê</a>' +
      '</div>' +
    '</footer>';

  setupHomeScroll();
  setupReveal();
}

function setupHomeScroll() {
  var bg = document.getElementById('heroBg');
  var content = document.querySelector('.hero-content');
  var hint = document.getElementById('heroScroll');
  if (!bg) return;
  homeScrollHandler = function () {
    var y = window.scrollY;
    if (y > window.innerHeight * 1.2) return;
    bg.style.transform = 'translateY(' + (y * 0.2) + 'px) scale(' + (1 + (y / 700) * 0.08) + ')';
    if (content) content.style.opacity = Math.max(0, 1 - y / 500);
    if (hint) hint.style.opacity = Math.max(0, 1 - y / 400);
  };
  window.addEventListener('scroll', homeScrollHandler, { passive: true });
  homeScrollHandler();
}

function renderWork(slug) {
  var w = WORKS.find(function (x) { return x.slug === slug; });
  if (!w) {
    app.innerHTML = '<div class="page container"><a class="back label" href="#/" data-cursor="">← Panorama</a><p style="margin-top:40px;font-size:24px;font-weight:300">Obra não encontrada.</p></div>';
    return;
  }
  currentWork = w;
  var gallery = (w.images || []).map(function (img, i) {
    var ratioClass = (i % 2 === 0) ? 'wide' : 'tall';
    var pos = (w.imagesPos && w.imagesPos[i]) ? 'object-position:' + w.imagesPos[i] + ';' : '';
    var zoom = (w.imagesZoom && w.imagesZoom[i] && w.imagesZoom[i] !== '100%') ? 'transform:scale(' + (parseFloat(w.imagesZoom[i])/100) + ');' : '';
    var fit = (w.imagesFit && w.imagesFit[i]) ? 'object-fit:' + w.imagesFit[i] + ';' : '';
    var imgStyle = (pos || zoom || fit) ? ' style="' + pos + zoom + fit + '"' : '';
    return '<button class="gallery-item reveal" data-action="open-lightbox" data-index="' + i + '" data-cursor="VER" aria-label="Ampliar imagem ' + (i + 1) + '"><div class="gframe ' + ratioClass + '"><img src="' + img + '" alt="' + esc(w.title) + ' — imagem ' + (i + 1) + '" loading="lazy"' + imgStyle + '></div></button>';
  }).join('');

  app.innerHTML =
    '<div class="page container">' +
      '<a class="back label" href="#/" data-cursor="">← Panorama</a>' +
      '<span class="detail-kicker label muted block">' + esc(w.categoryLabel || w.category) + ' · ' + esc(w.year) + '</span>' +
      '<h1 class="detail-title">' + esc(w.title) + '</h1>' +
      '<div class="detail-actions">' +
        '<button class="btn" data-action="open-drawer" data-cursor="ABRIR">Ficha Técnica & Conceito</button>' +
        '<a class="btn ghost-btn" href="https://wa.me/' + WHATSAPP + '?text=' + encodeURIComponent('Olá Henrique, tenho interesse no projeto "' + w.title + '".') + '" target="_blank" rel="noreferrer" data-cursor="">Atendimento · WhatsApp</a>' +
      '</div>' +
      '<div class="gallery">' + gallery + '</div>' +
    '</div>';
  setupReveal();
}

function renderAbout() {
  var facts = FACTS.map(function (f) {
    return '<div class="reveal"><span class="label muted">' + f.num + '</span><h3>' + esc(f.label) + '</h3><p>' + esc(f.text) + '</p></div>';
  }).join('');

  app.innerHTML =
    '<div class="about container">' +
      '<div class="about-grid">' +
        '<div><div class="about-sticky"><div class="portrait"><img src="' + PORTRAIT_IMG + '" alt="Retrato de Henrique Taveira em seu ateliê"></div><span class="label muted block" style="margin-top:16px">Henrique Taveira · Ateliê</span></div></div>' +
        '<div>' +
          '<div class="reveal"><span class="label muted">Perfil & Trajetória</span><h1 style="font-weight:200;font-size:48px;margin-top:12px;text-transform:uppercase;">Sobre</h1></div>' +
          '<div class="about-bio reveal">' +
            '<p>Henrique Taveira é estilista, artista visual e diretor criativo. Sua prática transita entre a alfaiataria de autor, a pesquisa têxtil e as artes plásticas.</p>' +
            '<p>Dupla formação — Design de Moda (IED) e Arquitetura & Urbanismo (PUC) — sustenta um olhar que lê o corpo como estrutura e o tecido como desenho.</p>' +
            '<p>Liderou por mais de seis anos a alfaiataria da ANIMALE, construindo silhuetas que cruzam rigidez construída e fluidez escultural, incluindo o desenvolvimento dos ternos oficiais da Seleção Brasileira Feminina de Futebol para a Copa do Mundo FIFA 2023.</p>' +
            '<p>O ateliê, com base entre Rio de Janeiro e São Paulo, opera como concierge: aquisições de arte, alfaiataria sob medida e direção criativa.</p>' +
          '</div>' +
          '<div class="facts">' + facts + '</div>' +
        '</div>' +
      '</div>' +
    '</div>';
  setupReveal();
}

/* ============ DRAWER & LIGHTBOX & CONTACT ============ */
var drawer = document.getElementById('drawer');
var drawerBd = document.getElementById('drawerBd');
function openDrawer(w) {
  document.getElementById('dTitle').textContent = w.title;
  document.getElementById('dYear').textContent = w.year;
  document.getElementById('dCat').textContent = w.categoryLabel || w.category;
  document.getElementById('dMat').textContent = w.materials;
  document.getElementById('dConcept').textContent = w.concept;
  drawer.classList.add('open');
  drawerBd.classList.add('open');
}
function closeDrawer() {
  drawer.classList.remove('open');
  drawerBd.classList.remove('open');
}
drawerBd.addEventListener('click', closeDrawer);

var lightbox = document.getElementById('lightbox');
var lbImg = document.getElementById('lbImg');
var lbCount = document.getElementById('lbCount');
var lbImages = [], lbIndex = 0;
function openLightbox(images, i) {
  lbImages = images; lbIndex = i;
  updateLightbox();
  lightbox.classList.add('open');
  document.body.style.overflow = 'hidden';
}
function updateLightbox() {
  lbImg.src = lbImages[lbIndex];
  lbCount.textContent = pad(lbIndex + 1) + ' / ' + pad(lbImages.length);
}
function closeLightbox() {
  lightbox.classList.remove('open');
  document.body.style.overflow = '';
}
function lbPrev() { lbIndex = (lbIndex - 1 + lbImages.length) % lbImages.length; updateLightbox(); }
function lbNext() { lbIndex = (lbIndex + 1) % lbImages.length; updateLightbox(); }
lightbox.addEventListener('click', function (e) { if (e.target === lightbox) closeLightbox(); });

var contact = document.getElementById('contact');
var interestsWrap = document.getElementById('interests');
var INTEREST_OPTIONS = ['Aquisição', 'Alfaiataria Sob Medida', 'Direção Criativa'];
function renderInterests() {
  interestsWrap.innerHTML = INTEREST_OPTIONS.map(function (i) {
    return '<button class="interest ' + (interest === i ? 'active' : '') + '" data-action="set-interest" data-val="' + esc(i) + '" data-cursor="">' + esc(i) + '</button>';
  }).join('');
  document.getElementById('waLink').href = 'https://wa.me/' + WHATSAPP + '?text=' + encodeURIComponent('Olá Henrique, tenho interesse em ' + interest + '.');
  document.getElementById('mailLink').href = 'mailto:' + EMAIL + '?subject=' + encodeURIComponent(interest);
}
function openContact() { contact.classList.add('open'); document.body.style.overflow = 'hidden'; }
function closeContact() { contact.classList.remove('open'); document.body.style.overflow = ''; }
renderInterests();

/* ============ ROUTER ============ */
function route() {
  var h = (location.hash || '#/').replace(/^#/, '');
  if (homeScrollHandler) { window.removeEventListener('scroll', homeScrollHandler); homeScrollHandler = null; }
  closeDrawer();
  closeLightbox();
  closeContact();

  var m = h.match(/^\/trabalho\/(.+)$/);
  if (m) renderWork(decodeURIComponent(m[1]));
  else if (h === '/sobre') renderAbout();
  else renderHome();

  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);

/* ============ GLOBAL ACTIONS ============ */
document.addEventListener('click', function (e) {
  var t = e.target.closest('[data-action]');
  if (!t) return;
  var a = t.getAttribute('data-action');
  if (a === 'open-contact') openContact();
  else if (a === 'close-contact') closeContact();
  else if (a === 'set-interest') { interest = t.getAttribute('data-val'); renderInterests(); }
  else if (a === 'set-filter') { activeCategory = t.getAttribute('data-cat'); renderHome(); }
  else if (a === 'open-drawer' && currentWork) openDrawer(currentWork);
  else if (a === 'close-drawer') closeDrawer();
  else if (a === 'open-lightbox' && currentWork) openLightbox(currentWork.images, parseInt(t.getAttribute('data-index'), 10));
  else if (a === 'close-lightbox') closeLightbox();
  else if (a === 'lb-prev') lbPrev();
  else if (a === 'lb-next') lbNext();
});

document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') {
    if (lightbox.classList.contains('open')) closeLightbox();
    else if (contact.classList.contains('open')) closeContact();
    else if (drawer.classList.contains('open')) closeDrawer();
  }
  if (lightbox.classList.contains('open')) {
    if (e.key === 'ArrowLeft') lbPrev();
    if (e.key === 'ArrowRight') lbNext();
  }
});

/* ============ CURSOR ============ */
(function () {
  if (!window.matchMedia('(pointer:fine)').matches) return;
  var cursor = document.getElementById('cursor');
  var label = document.getElementById('cursorLabel');
  window.addEventListener('mousemove', function (e) {
    cursor.style.transform = 'translate(' + e.clientX + 'px,' + e.clientY + 'px)';
  });
  document.addEventListener('mouseover', function (e) {
    var t = e.target.closest('[data-cursor]');
    if (t) { cursor.classList.add('hovering'); label.textContent = t.getAttribute('data-cursor') || ''; }
  });
  document.addEventListener('mouseout', function (e) {
    var t = e.target.closest('[data-cursor]');
    if (t) cursor.classList.remove('hovering');
  });
})();

route();
</script>
